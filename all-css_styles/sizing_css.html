<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Styling</title>
    <style>
        body {
            /* margin: 0;
            padding: 0px; */
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        html{
            font-size:20px;
        }
        .box {
            border: 2px solid black;
            /* width: 1920px; */
            width: 80vw;
            background-color: aqua;
            box-sizing: border-box;
            margin: auto;
            height:10vh;
        }
        .container{
            border: 2px solid black;
            /* width: 1920px; */
            width: 80vw;
            background-color: aqua;
            box-sizing: border-box;
            margin: 20px auto;
            /* height: 80vh;  */
            min-height:80vh;
            font-size: 20px;

        }
        .container >div{
            /* font-size:2em; */
            font-size:2rem;
            width: 50%;
            border:2px solid black;
        }

        .container >div >div{
            border: 2px solid blue;
            width: 50%;
        }

        .mycont{
            box-sizing :border-box;
            border: 2px solid black;
             margin: 20px auto; 
            background-color:red;
            color:yellow;
            font-size:22px;
            /* width: 100vmin; */
            width: 80vw;
        }
    </style>
</head>

<body>
    <h1>Body</h1>
    <p>This is a styled body element.</p>

    <div class="box">
        This is a box

    </div>

    <div class="container">

        <div>
        lorem ipsum dolor sit amet consectetur adipisicing elit.
         Quisquam, quod.lore

         <div>
            lorem ipsum dolor sit amet consectetur adipisicing elit.
         </div>
        </div>

    </div>

    <div class="mycont">
        This is a another container 
    </div>
</body>

</html>
